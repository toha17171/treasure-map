<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сокровище Роджера</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Pirata One', serif;
      background-color: #000;
      color: #fff;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: url('https://i.imgur.com/SIaT5EO.png'); /* пиратский фон */
      background-size: cover;
      background-position: center;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.75);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .content {
      z-index: 1;
      position: relative;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px #000;
    }

    #countdown {
      font-size: 2em;
      margin-top: 10px;
      color: #ffd700;
      text-shadow: 1px 1px 4px #000;
    }

    img.skull {
      width: 150px;
      height: auto;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="content">
    <img src="https://i.imgur.com/dD0U8qv.png" alt="Пиратский череп" class="skull">
    <h1>Время ещё не пришло...</h1>
    <div id="countdown">Загрузка...</div>
  </div>

  <script>
    const launchTime = new Date("2025-05-22T12:00:00"); // ЗАДАЙ время запуска
    const countdown = document.getElementById('countdown');

    function updateCountdown() {
      const now = new Date();
      const diff = launchTime - now;

      if (diff <= 0) {
        window.location.href = "main.html"; // переход на квест
        return;
      }

      const hours = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');
      const minutes = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, '0');
      const seconds = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');

      countdown.textContent = `${hours}:${minutes}:${seconds}`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
